services:
  # FastAPI Application
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://cropbalance:cropbalance_pass@postgres:5432/cropbalance_db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./main.py:/app/main.py:ro
      - ./services/local_mandi_service.py:/app/services/local_mandi_service.py:ro
      - ./services/reference_registry.py:/app/services/reference_registry.py:ro
      - ./data/reference:/app/data/reference:ro
      - ./data/raw/agmarknet_weekly:/app/data/raw/agmarknet_weekly:ro
    networks:
      - cropbalance-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cropbalance
      - POSTGRES_PASSWORD=cropbalance_pass
      - POSTGRES_DB=cropbalance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropbalance -d cropbalance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cropbalance-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cropbalance-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - cropbalance-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  cropbalance-network:
    driver: bridge
